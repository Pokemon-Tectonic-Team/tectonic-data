name: Build dev data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: npm install

      - run: npm run data:dev

      - name: Commit updated mappings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pokePartyMappedEncodings.json
          git diff --staged --quiet || git commit -m "Update PokeParty mappings from dev build [skip ci]"
          git push

      - name: Deploy to GitHub Pages
        run: |
          cp dist/loadedData-dev.json /tmp/
          cp dist/pokePartyMappedEncodings.json /tmp/
          if git fetch origin gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi
          cp /tmp/loadedData-dev.json .
          cp /tmp/pokePartyMappedEncodings.json .
          git add loadedData-dev.json pokePartyMappedEncodings.json
          git diff --staged --quiet || git commit -m "Deploy [skip ci]"
          git push origin gh-pages
